<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="containerPrincipal">
        <div class="divs-container">
            <div>
                <label for="nomeProduto">Nome do produto</label>
                <input type="text" id="nomeProduto" class="inputsProdutos" oninput="pesquisar()"> 
                <ul id="resulPesquisa" class="resulPesquisa"></ul>
            </div>
        
            <div>
                <label for="">Quantidade</label>
                <input type="number" id="quantidade" class="inputsProdutos">
            </div>
        
            <div>
                <label for="">Preço</label>
                <input type="number" id="preco" class="inputsProdutos">
            </div>
        
            <button onclick="adicionar()">Adicionar</button>
        </div>

        <div class="itensContainer">
            <table>
                <thead>
                    <tr>
                        <th>Produtos</th>
                        <th>Quantidade</th>
                        <th>Preço</th>
                    </tr>
                </thead>
                <tbody id="resul">
                    
                </tbody>
            </table>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
