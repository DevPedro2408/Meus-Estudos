<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h2>Escolha a operação:</h2>
    <div>
        <input type="radio" name="radioChecked" id="somar" value="somar" checked>
        <label for="somar">Somar</label>

        <input type="radio" name="radioChecked" id="subtrair" value="subtrair">
         <label for="subtrair">Subtrair</label>

        <input type="radio" name="radioChecked" id="multiplicar" value="multiplicar"> 
        <label for="multiplicar">Multiplicar</label>

        <input type="radio" name="radioChecked" id="dividir" value="dividir"> 
        <label for="dividir">Dividir</label>
    </div>

    <h2>Escolha dois valores para usar na operação:</h2>
    <input type="number" id="valor1">
    <input type="number" id="valor2">
    <button onclick="realizarOperacao()">Realizar operação</button>

    <div id="resultado"></div>

    <script src="script.js"></script>
</body>
</html>
