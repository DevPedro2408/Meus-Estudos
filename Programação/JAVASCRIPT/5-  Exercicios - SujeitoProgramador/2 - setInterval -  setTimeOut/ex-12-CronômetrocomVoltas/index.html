<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cronômetro com Voltas</title>
</head>
<body>
    <h1>Cronômetro</h1>
    <div>Aqui você marca o seu tempo</div>
    <div>
        <label for="inputNome">Digite seu nome:</label>
        <input type="text" id="inputNome" placeholder="Nome">
    </div>
    
    <div id="cronometro">
        <span id="minutos">00</span>:<span id="segundos">00</span>:<span id="milesimos">00</span>
    </div>
    <div class="btns">
        <button class="btn" id="start">Start</button>
        <button class="btn" id="parar">Stop</button>
        <button class="btn" id="reset">Reset</button>
        <button class="btn" id="salvarTempo">Salvar</button>
    </div>

    <ul id="lista">
    </ul>

    <script src="script.js"></script>
</body>
</html>
