<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <main>
        <h2>Formulário</h2>

        <div>
            <label for="nomeProduto">Nome do Produto:</label>
            <input type="text" class="inputs" id="nomeProduto">

            <label for="preco">Preço:</label>
            <input type="number" class="inputs" id="preco">

            <label for="categoria">Categoria:</label>
            <input type="text" class="inputs" id="categoria">

            <label for="quantidadeEstoque">Quantidade em estoque:</label>
            <input type="number" class="inputs" id="quantidadeEstoque">

            <button id="cadastrar" onclick="adicionarProduto()">Cadastrar</button>
        </div>
    </main>

    <table>
        <thead>
            <tr>
                <th class="numeracao">Nº</th>
                <th>Produto</th>
                <th>Preço</th>
                <th>Categoria</th>
                <th>Estoque</th>
                <th>Verificar Estoque</th>
            </tr>
        </thead>
        <tbody id="resul">
        </tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
