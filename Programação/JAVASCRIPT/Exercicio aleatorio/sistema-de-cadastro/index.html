<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body, main, div {
            display: flex;
        }

        body {
            justify-content: center;
            align-items: center;
            height: 100dvh;
        }

        main {
            flex-direction: column;
            align-items: center;
            gap: 20px;
            border: 1px solid black;
            border-radius: 10px;
            padding: 20px 30px;
        }

        div {
            flex-direction: column;
            gap: 5px;
        }

        input {
            padding: 2.5px 0 2.5px 5px;
        }
    </style>
    <title>Document</title>
</head>
<body>
    <main>
        <h2>Formulário</h2>

        <div>
            <label for="nomeProduto">Nome do Produto:</label>
            <input type="text" class="inputs" id="nomeProduto">

            <label for="preco">Preço:</label>
            <input type="number" class="inputs" id="preco">

            <label for="categoria">Categoria:</label>
            <input type="text" class="inputs" id="categoria">

            <label for="quantidadeEstoque">Quantidade em estoque:</label>
            <input type="number" class="inputs" id="quantidadeEstoque">

            <button id="cadastrar" onclick="adicionarProduto()">Cadastrar</button>
        </div>
    </main>

    <thead>
        <th></th>
    </thead>

    <script src="script.js"></script>
</body>
</html>
