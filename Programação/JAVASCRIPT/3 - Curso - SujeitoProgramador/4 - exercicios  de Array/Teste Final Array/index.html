<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <main>
        <div>
            <h2>Adicinar na lista de compras:</h2>
            <input type="text" name="" id="inputAdicionar">
            <button id="btnAdicionar">Adicionar</button>
        </div>
        
        <div>
            <div>Mostrar itens que começam com a letra: </div>
            <input type="text" id="inputLetra">
            <ul id="resultadoLetra" class="resultadoLetraClass">
            </ul>
        </div>
    </main>
    
    <section class="containerListaCompras">
        <h2 id="cabeçalhoListaCompras">Lista de Compras:</h2>
        <div id="containerResulLista">
            <ol id="resulListaCompras">
            </ol>
            <ol id="resultadoQuantidade">
            </ol>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
