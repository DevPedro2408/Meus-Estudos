<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            background-color: black;
            height: 100dvh;
            display: flex;
            justify-content: center;
            margin-top: 150px;
        }

        .box {
            width: 200px;
            height: 200px;
            border-radius: 20px;
            background-color: red;
            box-shadow: 0 10px 25px brown;
            -webkit-box-reflect: below 10px linear-gradient(transparent, rgba(0, 0, 0, 0.3));
        }
    </style>
    <title>Reflexo</title>
</head>
<body>
    <div class="box"></div>

    <script src="script.js"></script>
</body>
</html>
