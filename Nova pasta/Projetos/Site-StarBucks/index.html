<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="src/css/style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <nav class="navBar">
            <img src="src/images/logo-starbucks.png" alt="Logo starbucks" class="logo">

            <button class="btn bnt-mobile">
                <i class="fa-solid fa-bars"></i>
            </button>

            <ul class="nav-links">
                <li>
                    <a href="#home">Home</a>
                </li>
                <li>
                    <a href="">Em alta</a>
                </li>
                <li>
                    <a href="">Sobre nós</a>
                </li>
                <li>
                    <a href="">Novidade</a>
                </li>
            </ul>

            <a href="" class="btn btn-default">
                contatar
            </a>
        </nav>
    </header>

    <main id="container">
        <!-- Home -->
        <section id="home">
            <img src="src/images/detail.png" alt="" class="home-image">

            <h1 class="home-title">Mais que um café, uma <span>experiência</span></h1>

            <p class="home-description">Descubra cafés icônicos, sabores únicos e a energia perfeita para cada parte do seu dia.</p>

            <div class="home-botoes">
                <button class="btn btn-default">Conhecer</button>
                <button class="btn btn-outlined">Contatar</button>
            </div>
        </section>

        <!-- trending -->
         <section id="trending">
            <h2 class="title">
                Em alta
            </h2>

            <div class="trending-cards">
                <!-- card-1 -->
                <div class="trending-card">
                    <img src="src/images/trending/card1.png" alt="Starbucks Drinks">
                    
                    <div class="trending-rate">
                        <p>
                            5 <i class="fa-solid fa-star"></i>
                        </p>
                    </div>
        
                    <p class="trending-card-description">
                        Frappuccino  
                        <span>Avelã</span>
                    </p>
                </div>
                
                <!-- card-2 -->
                <div class="trending-card">
                    <img src="src/images/trending/card2.png" alt="Starbucks Drinks">
                    
                    <div class="trending-rate">
                        <p>
                            5 <i class="fa-solid fa-star"></i>
                        </p>
                    </div>
                    
                    <p class="trending-card-description">
                        Frappuccino  
                        <span>Pistache</span>
                    </p>
                </div>
            
            <!-- card-3 -->
                <div class="trending-card">
                    <img src="src/images/trending/card3.png" alt="Starbucks Drinks">
                    
                    <div class="trending-rate">
                        <p>
                            5 <i class="fa-solid fa-star"></i>
                        </p>
                    </div>
                    
                    <p class="trending-card-description">
                        Frappuccino  
                        <span>Morango</span>
                    </p>
                </div>
                
            </div>
            </section>
            
        </main>
        
    <script src="src/js/script.js"></script>
</body>
</html>
