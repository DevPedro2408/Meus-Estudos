<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <section class="Login-Criar">
        <input type="button" value="Criar conta" id="criarConta">

        <input type="button" value="Fazer login" id="fazerLogin">
    </section>

    <div class="containerCriar">
        <div class="containerUsuarioSenha">
            <label for="criarNome">Criar nome de usuário:</label>
            <input type="text" name="criarNome" id="criarNome">
            <div class="alertaNome"></div>

            <label for="criarSenha">Criar senha:</label>
            <input type="password" name="criarSenha" id="criarSenha">
            <div class="alertaSenha"></div>
        </div>

        <input type="button" value="Criar conta" id="btnSalvar">
        <div class="concluido">Cadastro Concluído!!!</div>
    </div>

    <section class="containerLogin">
        <div class="containerUsuarioSenha">
            <label for="nome">Nome de usuário:</label>
            <input type="text" name="nome" id="nomeUsuario">
            <div class="alertaNomeLogin"></div>

            <label for="senha">Senha:</label>
            <input type="text" name="senha" id="senhaUsuario">
            <div class="alertaSenhaLogin"></div>
        </div>

        <input type="button" value="Entrar" id="btnEntrar">
        <div class="entrou"></div>
    </section>


    <script src="script.js"></script>
</body>

</html>
