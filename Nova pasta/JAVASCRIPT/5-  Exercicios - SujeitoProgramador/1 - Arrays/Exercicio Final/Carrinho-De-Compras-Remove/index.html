<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="addProdutosContainer">
        <h2>Adicinar produtos da minha loja</h2>

        <div class="containerProdutos">
            <input type="text" class="inputAddProdutos" id="inputNome" placeholder="">
            <label for="inputNome" class="labelClass" id="labelProduto">Produto</label>
        </div>

        <div class="containerProdutos">
            <input type="number" class="inputAddProdutos" id="inputPreco" placeholder="">
            <label for="inputPreco" class="labelClass" id="labelPreco">Preço</label>
        </div>
        
        <div class="containerProdutos">
            <input type="number" class="inputAddProdutos" id="inputQuantidade" placeholder="">
            <label for="inputQuantidade" class="labelClass" id="labelQuantidade">Quantidade</label>
        </div>

        <button id="btnAdicionar">Adicionar</button>
    </div>

    <h2>Produtos no estoque</h2>
    <ul id="produtos" class="produtosClass"></ul>

    <h2>Carrinho</h2>
    <ul id="carrinhoResul" class="carrinhoResulClass"></ul>

    <div id="resulTotal"></div>

    <script src="script.js"></script>
</body> 
</html>
